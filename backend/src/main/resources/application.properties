spring.application.name=backend

# ── HTTP compression ──────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-http-form-post-size=500MB
server.tomcat.max-swallow-size=500MB
logging.file.name=logs/simulation.log
logging.file.max-size=50MB

# ── MySQL DataSource ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP (pool de conexiones) ────────────────────────────────
spring.datasource.hikari.pool-name=TasfPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000

# ── Ops DataSource (schema daily_simulation) ─────────────────────
ops.datasource.url=${OPS_DATASOURCE_URL:${spring.datasource.url}}
ops.datasource.username=${OPS_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
ops.datasource.password=${OPS_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
ops.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
ops.datasource.hikari.pool-name=OpsPool
ops.datasource.hikari.maximum-pool-size=20
ops.datasource.hikari.minimum-idle=1
ops.datasource.hikari.connection-timeout=60000

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
